# CLAUDE.md §5·§11-14 의 검증을 매 커밋마다 (검증 검토: 전부 사람 손에 의존했다). 원격 저장소를 만들면 그대로 동작한다.
# 백엔드 IT(Testcontainers)는 GitHub 러너의 Docker 로 돈다 — 로컬(Docker 없음)에서 한 번도 돌지 못한 통합 테스트가 여기서 처음 검증된다.
name: ci
# 어느 브랜치든 push 할 때와 PR 을 열거나 갱신할 때 돈다
on:
  push:
  pull_request:
# 외부 Action 은 태그가 아니라 커밋 SHA 로 고정한다(태그는 옮겨질 수 있다, 감사 L-01). 올릴 때는 새 태그의 SHA 를 git ls-remote 로 확인해 바꾼다
# 이 워크플로의 모든 작업이 쓰는 GitHub 토큰의 권한을 '저장소 내용 읽기' 로만 줄인다 (검사만 하고 아무것도 쓰지 않는다)
permissions:
  contents: read
# 아래 작업(apps, backend)은 needs 로 잇지 않았으므로 서로 기다리지 않고 동시에 돈다
jobs:
  # 두 앱·공용 UI 검사: CLAUDE.md §5 의 보고 전 검증 명령에 mock 계약 스냅숏 검사를 더한 것
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # npm 내려받기 캐시를 다음 실행에 재사용해 설치를 빠르게 한다
          cache: npm
      # package-lock.json 에 적힌 버전 그대로 설치한다 (npm install 과 달리 lock 파일을 고치지 않는다)
      - run: npm ci
      # 토큰 생성물(tokens.css 등)을 design/figma-tokens.json 에서 다시 만들어 보고, 커밋된 것과 다르면 실패한다
      - run: npm run tokens && git diff --exit-code packages/ui/src/tokens
      - run: node scripts/backend-mock-export.mjs shapes && git diff --exit-code backend/src/test/resources/mock-shapes   # 앱 mock 과 백엔드 계약 스냅숏이 어긋나면 여기서 (전체 재점검: V021 뒤 confirm-copy 가 낡아 있었다)
      # 이어서 Vitest 테스트 → 하드코딩 색·폰트 검사 → ESLint → 빌드. 한 단계라도 실패하면 거기서 멈추고 작업이 실패한다
      - run: npm test
      - run: npm run check:tokens
      - run: npm run lint
      - run: npm run build
  # 서버(Spring) 검사: backend 폴더에서 Maven 래퍼(mvnw)로 빌드와 테스트를 한 번에 돌린다
  backend:
    runs-on: ubuntu-latest
    # 이 작업의 모든 run 명령은 backend 폴더 안에서 실행된다
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          # Maven 이 내려받은 라이브러리를 다음 실행에 재사용한다
          cache: maven
      # 주의: JaCoCo check(최소 0.70)는 돌지만, 규칙의 클래스 패턴이 번들 이름(api)과 맞지 않아 지금은 아무것도 재지 않는다
      # (backend/pom.xml 의 BUNDLE 주석). 커버리지가 떨어져도 이 단계는 실패하지 않는다
      - run: ./mvnw -q verify   # 단위 + 통합(Testcontainers Postgres) + ArchUnit + JaCoCo check
