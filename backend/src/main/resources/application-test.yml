# 테스트. DB 는 Testcontainers Postgres 가 @ServiceConnection 으로 붙인다 (url 을 여기 쓰지 않는다)
# 테스트 클래스가 @ActiveProfiles("test") 로 이 프로필을 켜면 application.yml 위에 덮어쓴다.
# 아래 비밀값·솔트는 테스트 전용 가짜 값이다 (운영 값과 무관). 이 프로필에서는 스케줄러가 꺼진다(SchedulingConfig)
app:
  payment:
    client-key: ""
    secret-key: ""
  # SecurityConfigTest 가 이 출처로 CORS 허용을 확인한다
  cors:
    allowed-origins: http://localhost:5175
  supabase:
    url: https://test.supabase.local
    # secret 모드: JWKS 주소 없이 아래 비밀키로 토큰 디코더를 만든다 (SupabaseJwtDecoderConfig).
    # 슬라이스·IT 테스트는 JwtDecoder 를 @MockitoBean 가짜로 바꿔 쓴다 (ItSupport·ManagerMvc)
    jwt-mode: secret
    jwt-secret: test-secret-test-secret-test-secret-test-secret-32bytes
  sms:
    provider: logging
  push:
    mode: logging
  otp:
    salt: test-salt-not-for-production
  livekit:                                  # 백엔드 컴퓨터의 .env(LIVEKIT_MODE=cloud·실제 키)가 IT 에 섞이지 않게 고정. 게이트웨이는 각 IT 가 mock 한다
    mode: logging
    url: ""
    api-key: ""
    api-secret: ""
    source: ingress                         # 기존 IT 는 바디캠(Ingress) 흐름을 검증한다. 휴대폰 송출은 단위 테스트(LiveServiceAppSourceTest 등)가 본다

# 테스트 로그는 텍스트로 (application.yml 의 ecs JSON 을 끈다)
logging:
  structured:
    format:
      console:
